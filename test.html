<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информационная безопасность — Тест</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }

        .container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 680px;
            padding: 40px 44px;
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .q-counter {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .progress {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 32px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 3px;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.7);
        }

        .question {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 26px;
            line-height: 1.5;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer {
            display: flex;
            align-items: center;
            padding: 16px 18px;
            background: #0f172a;
            border: 2px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            color: var(--text);
            position: relative;
            user-select: none;
        }

            .answer:hover {
                border-color: var(--primary);
                background: #1a2332;
                transform: translateX(4px);
            }

            .answer.selected {
                border-color: var(--primary);
                background: rgba(99, 102, 241, 0.15);
                box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            }

            .answer .check {
                width: 22px;
                height: 22px;
                min-width: 22px;
                border-radius: 50%;
                border: 2px solid var(--border);
                margin-right: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s;
                background: #0f172a;
            }

            .answer.selected .check {
                background: var(--primary);
                border-color: var(--primary);
            }

                .answer.selected .check::after {
                    content: '';
                    width: 8px;
                    height: 8px;
                    background: #fff;
                    border-radius: 50%;
                }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 24px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 32px rgba(99, 102, 241, 0.5);
            }

            button:active {
                transform: translateY(0);
            }

        .error {
            color: #f87171;
            font-size: 13px;
            margin-top: 16px;
            padding: 10px 14px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <span id="userLabel">—</span>
            <span class="q-counter" id="qCounter">Вопрос 1 из 8</span>
        </div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <div class="question" id="questionText"></div>
        <div class="answers" id="answersBox"></div>
        <div class="error" id="error">⚠️ Выберите один из вариантов ответа</div>
        <button onclick="nextQuestion()" id="nextBtn">
            Далее
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
        </button>
    </div>

    <script>
  const questions = [
    {
      q: "Что такое фишинг?",
      answers: [
        "Вид мошенничества для получения конфиденциальных данных через поддельные сайты и письма",
        "Способ шифрования файлов",
        "Программа для ускорения интернета",
        "Тип компьютерного вируса, стирающего данные"
      ],
      correct: 0
    },
    {
      q: "Какой пароль считается наиболее надёжным?",
      answers: [
        "12345678",
        "qwerty",
        "Дата рождения",
        "G7#kL9!mP2@x"
      ],
      correct: 3
    },
    {
      q: "Что такое двухфакторная аутентификация (2FA)?",
      answers: [
        "Ввод двух паролей подряд",
        "Подтверждение входа двумя разными способами (например, пароль + код из SMS)",
        "Два раза нажать кнопку «Войти»",
        "Вход с двух устройств одновременно"
      ],
      correct: 1
    },
    {
      q: "Какое действие НАИБОЛЕЕ безопасно при получении письма от неизвестного отправителя со ссылкой?",
      answers: [
        "Перейти по ссылке и посмотреть",
        "Переслать друзьям",
        "Удалить письмо, не открывая ссылки",
        "Ответить отправителю и спросить, кто он"
      ],
      correct: 2
    },
    {
      q: "Что означает аббревиатура HTTPS в адресе сайта?",
      answers: [
        "Сайт работает быстро",
        "Соединение защищено шифрованием",
        "Сайт является государственным",
        "Сайт не содержит вирусов"
      ],
      correct: 1
    },
    {
      q: "Что такое социальная инженерия?",
      answers: [
        "Раздел социологии",
        "Метод проектирования соцсетей",
        "Манипуляция людьми для получения конфиденциальной информации",
        "Инженерное образование в соцсфере"
      ],
      correct: 2
    },
    {
      q: "Какое правило безопасности в публичном Wi-Fi верно?",
      answers: [
        "Можно спокойно входить в онлайн-банк",
        "Не стоит вводить пароли и данные карт без VPN",
        "Публичный Wi-Fi всегда безопаснее домашнего",
        "Нужно отключить антивирус для скорости"
      ],
      correct: 1
    },
    {
      q: "Что нужно делать с паролями регулярно?",
      answers: [
        "Никогда не менять",
        "Менять раз в год и хранить одинаковые на всех сервисах",
        "Использовать разные сложные пароли и менять при подозрении на утечку",
        "Записывать в блокнот, который всегда с собой"
      ],
      correct: 2
    }
  ];

  let user = {};
  let current = 0;
  let selected = null;
  let userAnswers = [];

  // Проверка авторизации
  const stored = localStorage.getItem('quiz_user');
  if (!stored) {
    window.location.href = 'index.html';
  } else {
    user = JSON.parse(stored);
    document.getElementById('userLabel').textContent = '👤 ' + user.login;
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[current];
    document.getElementById('qCounter').textContent =
      `Вопрос ${current + 1} из ${questions.length}`;
    document.getElementById('progressBar').style.width =
      ((current) / questions.length * 100) + '%';
    document.getElementById('questionText').textContent = q.q;

    const box = document.getElementById('answersBox');
    box.innerHTML = '';
    q.answers.forEach((ans, i) => {
      const label = document.createElement('div');
      label.className = 'answer' + (selected === i ? ' selected' : '');
      label.innerHTML = `<div class="check"></div><span>${ans}</span>`;
      label.addEventListener('click', () => {
        selected = i;
        document.querySelectorAll('.answer').forEach(el => el.classList.remove('selected'));
        label.classList.add('selected');
      });
      box.appendChild(label);
    });

    document.getElementById('nextBtn').innerHTML =
      current === questions.length - 1
        ? 'Завершить тест <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
        : 'Далее <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';

    document.getElementById('error').style.display = 'none';
  }

  function nextQuestion() {
    if (selected === null) {
      document.getElementById('error').style.display = 'flex';
      return;
    }

    userAnswers.push(selected);
    selected = null;
    current++;

    if (current < questions.length) {
      renderQuestion();
    } else {
      localStorage.setItem('quiz_answers', JSON.stringify(userAnswers));
      window.location.href = 'result.html';
    }
  }
    </script>
</body>
</html>
