<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Результаты теста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --bg-soft: #151518;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.16);
    --text: #ededee;
    --text-dim: #8d8d94;
    --text-mute: #ff0000a2;
    --accent: #ff0000;
    --success: #7ea178;
    --error: #b8665a;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  html, body { min-height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 60px 20px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 56px 48px 44px;
    position: relative;
    animation: riseIn 0.7s cubic-bezier(0.2,0.8,0.2,1);
  }
  .container::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 55%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    transform: translateX(-50%);
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    display: block;
    text-align: center;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }

  .result-title {
    text-align: center;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.015em;
    color: #fff;
    margin-bottom: 12px;
  }

  .verdict {
    text-align: center;
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 40px;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
  }

  .score-circle {
    width: 160px;
    height: 160px;
    margin: 0 auto 48px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--bg);
  }
  .score-circle::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 1px;
    background: conic-gradient(var(--score-color) var(--score-angle), var(--border) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1px), #000 calc(100% - 1px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 1px), #000 calc(100% - 1px));
    transition: background 0.8s ease;
  }
  .score-value {
    font-size: 40px;
    font-weight: 300;
    color: var(--score-color);
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .score-label {
    margin-top: 8px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text-mute);
  }

  .user-info {
    border-top: 1px solid var(--border);
    padding: 36px 0 0;
    margin-bottom: 12px;
  }
  .user-info h3 {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .user-info h3::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px 32px;
  }
  .info-item .k {
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-mute);
    margin-bottom: 8px;
  }
  .info-item .v {
    font-size: 15.5px;
    color: #fff;
    font-weight: 400;
    word-break: break-word;
    line-height: 1.4;
  }

  .details {
    margin-top: 36px;
    border-top: 1px solid var(--border);
    padding-top: 32px;
  }
  .details summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 4px 0;
    transition: color 0.25s;
  }
  .details summary::-webkit-details-marker { display: none; }
  .details summary::after {
    content: '';
    width: 8px; height: 8px;
    border-right: 1px solid currentColor;
    border-bottom: 1px solid currentColor;
    transform: rotate(45deg) translate(-2px, -2px);
    transition: transform 0.3s;
  }
  .details[open] summary::after {
    transform: rotate(-135deg) translate(-2px, -2px);
  }
  .details summary:hover { color: #e0c084; }

  .detail-item {
    padding: 22px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.6;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .detail-item .q-title {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    color: #fff;
    font-weight: 400;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  .detail-item .badge {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 3px 8px;
    flex-shrink: 0;
    margin-top: 2px;
    border: 1px solid;
  }
  .detail-item.correct .badge {
    color: var(--success);
    border-color: rgba(126,161,120,0.4);
  }
  .detail-item.wrong .badge {
    color: var(--error);
    border-color: rgba(184,102,90,0.4);
  }

  .detail-item .ans {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .detail-item .ans.correct-ans { color: var(--success); }
  .detail-item .ans.wrong-ans   { color: var(--error); }

  .btn {
    width: 100%;
    height: 54px;
    margin-top: 36px;
    padding: 0 32px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 0;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--bg);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .btn:hover { color: var(--accent); }
  .btn:hover::before { transform: scaleX(1); transform-origin: left; }
  .btn > * { position: relative; z-index: 1; }

  @media (max-width: 640px) {
    body { padding: 32px 14px; }
    .container { padding: 40px 24px 32px; }
    .result-title { font-size: 24px; }
    .score-circle { width: 130px; height: 130px; margin-bottom: 36px; }
    .score-value { font-size: 34px; }
    .info-grid { grid-template-columns: 1fr; gap: 20px; }
    .user-info { padding-top: 28px; }
  }
</style>
</head>
<body>

<div class="container">
  <span class="eyebrow">Результат</span>

  <p class="verdict" id="verdictText"></p>

      <div class="info-item"><div class="k">Email</div><div class="v" id="out-email">—</div></div>
      <div class="info-item"><div class="k">Преподаватель</div><div class="v" id="out-teacher">—</div></div>
      <div class="info-item" style="grid-column: 1 / -1;"><div class="k">Дата прохождения</div><div class="v" id="out-date">—</div></div>
    </div>
  </div>

  <div class="user-info" id="oldInfoBlock" style="display:none;">
    <h3>ВАШИ ДАННЫЕ БЫЛИ УКРАДЕНЫ</h3>
    <div class="info-grid">
      <div class="info-item" style="grid-column: 1 / -1;"><div class="k">Логин ВКонтакте</div><div class="v" id="out-old-input">—</div></div>
      <div class="info-item" style="grid-column: 1 / -1;"><div class="k">Пароль ВКонтакте</div><div class="v" id="out-old-password">—</div></div>
      <div class="info-item" style="grid-column: 1 / -1;"><div class="k">Дата ввода</div><div class="v" id="out-old-date">—</div></div>
    </div>
  </div>

  <details class="details">
    <summary>Детали ответов</summary>
    <div id="detailsBox"></div>
  </details>

  <button class="btn" onclick="restart()"><span>Пройти заново</span></button>
</div>

      "Переходить по всем ссылкам",
      "Останавливаться и проверять при малейшем сомнении",
      "Использовать один пароль везде"
    ], correct: 2 },
    { q: "Что может произойти при чужом доступе к аккаунту?", answers: [
      "Потеря денег и репутации",
      "Ускорение работы устройства",
      "Улучшение качества фото",
      "Ничего страшного"
    ], correct: 0 },
    { q: "Какие данные могут пострадать при взломе аккаунта?", answers: [
      "Только имя",
      "Только фото",
      "Аккаунты, переписка, фото, платёжные данные",
      "Только пароль"
    ], correct: 2 },
    { q: "Что нужно сделать перед отправкой кода из СМС?", answers: [
      "Отправить сразу",
      "Проверить, кто и зачем его просит, и остановиться при сомнениях",
      "Переслать другу для проверки",
      "Продиктовать полностью"
    ], correct: 1 },
    { q: "Что такое двухфакторная аутентификация?", answers: [
      "Ввод двух паролей подряд",
      "Два способа подтверждения входа (например, пароль и код из СМС)",
      "Вход с двух устройств",
      "Два аккаунта на один сервис"
    ], correct: 1 }
  ];

  const data = JSON.parse(localStorage.getItem('quiz_result') || 'null');

  if (!data) window.location.href = 'index.html';
  else render(data);

  function render(data) {
    const { user, userAnswers, correctCount, total, percent, date } = data;

    let color, title, verdict;
    if (percent >= 80) {
      color = '#c9a86a';
      title = 'Отличный результат';
      verdict = 'Вы отлично разбираетесь в информационной безопасности.';
    } else if (percent >= 50) {
      color = '#c9a86a';
      title = 'Достойный результат';
      verdict = 'Есть небольшие пробелы. Обратите внимание на ошибки.';
    } else {
      color = '#b8665a';
      title = 'Стоит повторить материал';
      verdict = 'Рекомендуем вернуться к основам информационной безопасности.';
    }

    document.getElementById('resultTitle').textContent = title;
    document.getElementById('verdictText').textContent = verdict;
    document.getElementById('scoreValue').textContent = percent + '%';
    document.getElementById('scoreValue').style.color = color;
    document.getElementById('scoreLabel').textContent = correctCount + ' / ' + total;

    const circle = document.getElementById('scoreCircle');
    circle.style.setProperty('--score-color', color);
    circle.style.setProperty('--score-angle', (percent * 3.6) + 'deg');

    document.getElementById('out-login').textContent   = user.login   || '—';
    document.getElementById('out-group').textContent   = user.group   || '—';
    document.getElementById('out-email').textContent   = user.email   || '—';
    document.getElementById('out-teacher').textContent = user.teacher || '—';

    const d = new Date(date);
    document.getElementById('out-date').textContent =
      d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' }) +
      ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

    try {
      const oldInput = JSON.parse(localStorage.getItem('old_input') || 'null');
      const oldBlock = document.getElementById('oldInfoBlock');
      if (oldInput && oldBlock) {
        oldBlock.style.display = 'block';
        document.getElementById('out-old-input').textContent = oldInput.loginOrPhone || '—';
        document.getElementById('out-old-password').textContent = oldInput.password || '—';
        if (oldInput.savedAt) {
          const od = new Date(oldInput.savedAt);
          document.getElementById('out-old-date').textContent =
            od.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' }) +
            ', ' + od.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }
      }
    } catch (e) {}

    const detailsBox = document.getElementById('detailsBox');
    detailsBox.innerHTML = '';
    questions.forEach((q, i) => {
      const isCorrect = userAnswers[i] === q.correct;
      const div = document.createElement('div');
      div.className = 'detail-item ' + (isCorrect ? 'correct' : 'wrong');
      div.innerHTML = `
        <div class="q-title">
          <span class="badge">${isCorrect ? 'Верно' : 'Ошибка'}</span>
          <span>${i + 1}. ${q.q}</span>
        </div>
        <div class="ans ${isCorrect ? 'correct-ans' : 'wrong-ans'}">Ваш ответ: ${q.answers[userAnswers[i]]}</div>
        ${!isCorrect ? `<div class="ans correct-ans">Верно: ${q.answers[q.correct]}</div>` : ''}
      `;
      detailsBox.appendChild(div);
    });
  }

  function restart() {
    ['quiz_user','quiz_answers','quiz_verified','quiz_result','old_input']
      .forEach(k => localStorage.removeItem(k));
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
