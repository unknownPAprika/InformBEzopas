<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест — Информационная безопасность</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --bg-soft: #151518;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.16);
    --text: #ededee;
    --text-dim: #8d8d94;
    --text-mute: #5a5a62;
    --accent: #c9a86a;
    --accent-dim: rgba(201,168,106,0.4);
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  .card {
    width: 100%;
    max-width: 620px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 44px 44px 38px;
    position: relative;
    animation: riseIn 0.6s cubic-bezier(0.2,0.8,0.2,1);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 50%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    transform: translateX(-50%);
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 26px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-mute);
  }
  .user-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .user-label strong { color: var(--text-dim); font-weight: 500; }
  .q-counter {
    color: var(--accent);
    white-space: nowrap;
    font-feature-settings: "tnum";
  }

  .progress {
    height: 1px;
    background: var(--border);
    position: relative;
    margin-bottom: 40px;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    position: relative;
  }
  .progress-bar::after {
    content: '';
    position: absolute;
    right: 0; top: 50%;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    transform: translate(50%, -50%);
    box-shadow: 0 0 12px var(--accent);
  }

  .question {
    font-size: 21px;
    font-weight: 300;
    line-height: 1.4;
    letter-spacing: -0.01em;
    color: #fff;
    margin-bottom: 28px;
    min-height: 60px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .answers { display: flex; flex-direction: column; margin-bottom: 30px; }

  .answer {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 18px 8px 18px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-dim);
    position: relative;
    transition: color 0.25s, padding-left 0.3s;
    user-select: none;
  }
  .answer:first-child { border-top: 1px solid var(--border); }

  .answer::before {
    content: '';
    flex-shrink: 0;
    width: 16px; height: 16px;
    margin-top: 3px;
    border: 1px solid var(--border-hover);
    border-radius: 50%;
    transition: all 0.25s;
    position: relative;
  }
  .answer::after {
    content: '';
    position: absolute;
    left: 4px; top: 21px;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    transform: scale(0);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  }

  .answer > span { flex: 1; }

  .answer:hover { color: var(--text); padding-left: 4px; }
  .answer:hover::before { border-color: var(--accent-dim); }

  .answer.selected { color: #fff; padding-left: 4px; }
  .answer.selected::before { border-color: var(--accent); }
  .answer.selected::after { transform: scale(1); }

  .btn {
    width: 100%;
    height: 54px;
    padding: 0 32px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 0;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--bg);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .btn:hover { color: var(--accent); }
  .btn:hover::before { transform: scaleX(1); transform-origin: left; }
  .btn > * { position: relative; z-index: 1; }

  .error {
    margin-top: 14px;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #c0705c;
    display: none;
    text-align: center;
  }
  .error.show { display: block; animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @media (max-width: 480px) {
    body { padding: 24px 14px; align-items: flex-start; }
    .card { padding: 32px 22px 26px; }
    .question { font-size: 18px; margin-bottom: 22px; min-height: 48px; }
    .answer { padding: 15px 4px 15px 0; font-size: 14.5px; gap: 12px; }
    .answer::after { left: 4px; top: 18px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="top-bar">

  <button class="btn" onclick="nextQuestion()" id="nextBtn"><span>Далее</span></button>
</div>

    { q: "Что делать, если программа требует отключить защиту ради установки?", answers: [

      "Случайным прохожим"
    ], correct: 0 },

    { q: "Какие эмоции пытаются вызвать мошенники у жертвы?", answers: [
      "Радость и интерес",
      "Страх и спешку",

    { q: "Что означает принцип доступности?", answers: [
      "Данные доступны с любого устройства",
      "Данные доступны бесплатно",
      "Вы можете открыть свои данные, когда они нужны",
      "Данные доступны в любое время суток"
    ], correct: 2 },

    { q: "Что защищает двухфакторная аутентификация (2FA)?", answers: [
      "Скорость входа в аккаунт",
      "Вход в аккаунт даже при утечке пароля",
      "Размер файлов на сервере",
      "Количество устройств пользователя"
    ], correct: 1 },

    { q: "С какого аккаунта рекомендуют начинать защиту?", answers: [
      "С игрового",
      "С социальной сети",
      "С почты, через которую восстанавливают доступ к другим аккаунтам",
      "С любого по желанию"
    ], correct: 2 },

    { q: "Зачем нужно включать автоматическое обновление системы?", answers: [
      "Чтобы экономить место на диске",
      "Чтобы получить новые функции",
      "Чтобы закрывать уязвимости безопасности",
      "Чтобы ускорить работу устройства"
    ], correct: 2 },

    { q: "Что важно проверить перед кликом по ссылке?", answers: [
      "Размер сообщения",
      "Скорость загрузки",
      "Адрес отправителя и сам домен",
      "Количество рекламы на сайте"
    ], correct: 2 },

    { q: "Зачем нужны резервные копии важных файлов?", answers: [
      "Чтобы освободить место на устройстве",
      "Чтобы восстановить данные при сбое или атаке",

      "Чтобы уменьшить размер файлов"
    ], correct: 1 },

    { q: "Что делать перед переводом денег незнакомому человеку?", answers: [
      "Проверить реквизиты и связаться с человеком другим способом",
      "Перевести сразу, пока курс выгодный",
      "Перевести мелкими частями",
      "Попросить у банка подтверждение"
    ], correct: 0 },

    { q: "Что делать при любых сомнениях в подлинности?", answers: [

      "Три",
      "Четыре",
      "Пять",
      "Семь"
    ], correct: 2 },

      "Это снижает безопасность и одна утечка превращается в несколько взломов",

    ], correct: 1 },

      "Слишком длинная ссылка",
      "Ссылка с параметрами отслеживания",
      "Лишняя буква или другой домен вместо настоящего",
      "Ссылка с https вместо http"
    ], correct: 2 },

    { q: "Как связаться с человеком, если от его имени пришла подозрительная просьба?", answers: [
      "Ответить на это же сообщение",
      "Позвонить по известному вам номеру",
      "Переслать просьбу друзьям",
      "Подождать, пока он сам напишет"
    ], correct: 1 },

    { q: "Что важно помнить про «бесплатные подарки» в играх?", answers: [
      "Они всегда настоящие",
      "Их выдают разработчики игр",
      "За ними часто прячутся мошенники, которые просят пароль",
      "Они не требуют регистрации"
    ], correct: 2 },

    { q: "Какое правило поведения в интернете считается базовым?", answers: [
      "Доверять незнакомцам",
      "Переходить по всем ссылкам",
      "Останавливаться и проверять при малейшем сомнении",
      "Использовать один пароль везде"
    ], correct: 2 },

    { q: "Что может произойти при чужом доступе к аккаунту?", answers: [
      "Потеря денег и репутации",
      "Ускорение работы устройства",
      "Улучшение качества фото",
      "Ничего страшного"
    ], correct: 0 },

    { q: "Какие данные могут пострадать при взломе аккаунта?", answers: [
      "Только имя",
      "Только фото",
      "Аккаунты, переписка, фото, платёжные данные",
      "Только пароль"
    ], correct: 2 },

    { q: "Что нужно сделать перед отправкой кода из СМС?", answers: [
      "Отправить сразу",
      "Проверить, кто и зачем его просит, и остановиться при сомнениях",
      "Переслать другу для проверки",
      "Продиктовать полностью"
    ], correct: 1 },

    { q: "Что такое двухфакторная аутентификация?", answers: [
      "Ввод двух паролей подряд",
      "Два способа подтверждения входа (например, пароль и код из СМС)",
      "Вход с двух устройств",
      "Два аккаунта на один сервис"
    ], correct: 1 }
  ];

  const pad = (n) => String(n).padStart(2, '0');

  let user = {};
  let current = 0;
  let selected = null;
  let userAnswers = [];

  const stored = localStorage.getItem('quiz_user');
  if (!stored) {
    window.location.href = 'index.html';
  } else {
    try {
      user = JSON.parse(stored);
      document.getElementById('userLabel').textContent = user.login || '—';
      renderQuestion();
    } catch (e) {
      console.error('Ошибка инициализации:', e);
    }
  }

  function renderQuestion() {
    const q = questions[current];
    if (!q) return;

    document.getElementById('qCounter').textContent =
      pad(current + 1) + ' / ' + pad(questions.length);
    document.getElementById('progressBar').style.width =
      (current / questions.length * 100) + '%';
    document.getElementById('questionText').textContent = q.q;

    const box = document.getElementById('answersBox');
    box.innerHTML = '';

    q.answers.forEach((ans, i) => {
      const el = document.createElement('div');
      el.className = 'answer' + (selected === i ? ' selected' : '');
      el.innerHTML = '<span>' + ans + '</span>';
      el.addEventListener('click', () => {
        selected = i;
        document.querySelectorAll('.answer').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById('error').classList.remove('show');
      });
      box.appendChild(el);
    });

    document.getElementById('nextBtn').innerHTML =
      '<span>' + (current === questions.length - 1 ? 'Завершить' : 'Далее') + '</span>';

    document.getElementById('error').classList.remove('show');
  }

  function nextQuestion() {
    if (selected === null) {
      document.getElementById('error').classList.add('show');
      return;
    }
    userAnswers.push(selected);
    selected = null;
    current++;

    if (current < questions.length) {
      renderQuestion();
    } else {
      localStorage.setItem('quiz_answers', JSON.stringify(userAnswers));
      window.location.href = 'result.html';
    }
  }
</script>
