<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Начало теста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --bg-soft: #151518;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.16);
    --text: #ededee;
    --text-dim: #8d8d94;
    --text-mute: #5a5a62;
    --accent: #c9a86a;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 56px 44px 44px;
    position: relative;
    animation: riseIn 0.7s cubic-bezier(0.2,0.8,0.2,1);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    transform: translateX(-50%);
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    padding-left: 34px;
    position: relative;
    margin-bottom: 24px;
  }
  .eyebrow::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    width: 24px; height: 1px;
    background: var(--accent);
    transform: translateY(-50%);
  }

  h1 {
    font-size: 30px;
    font-weight: 300;
    letter-spacing: -0.015em;
    color: #fff;
    line-height: 1.15;
    margin-bottom: 14px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 40px;
  }

  .field { margin-bottom: 22px; }

  label {
    display: block;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-mute);
    margin-bottom: 10px;
  }

  input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-hover);
    border-radius: 0;
    outline: none;
    transition: border-color 0.3s;
  }
  input::placeholder { color: #3d3d44; }
  input:hover { border-bottom-color: rgba(255,255,255,0.28); }
  input:focus {
    border-bottom-color: var(--accent);
    box-shadow: 0 1px 0 0 var(--accent);
  }

  .btn {
    width: 100%;
    height: 54px;
    margin-top: 20px;
    padding: 0 32px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 0;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--bg);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
    z-index: 0;
  }
  .btn:hover { color: var(--accent); }
  .btn:hover::before { transform: scaleX(1); transform-origin: left; }
  .btn > * { position: relative; z-index: 1; }

  .note {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-mute);
    line-height: 1.7;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    body { padding: 20px 14px; }
    .card { padding: 44px 26px 34px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="card">
  <span class="eyebrow">Авторизация</span>
  <h1>Тест по безопасности</h1>
  <p class="subtitle">Заполните данные, чтобы начать прохождение</p>

  <form id="form" autocomplete="off">
    <div class="field">
      <label for="login">Логин / ФИО</label>
      <input id="login" name="login" type="text" required maxlength="100" placeholder="ivan_ivanov">
    </div>

    <div class="field">
      <label for="group">Группа</label>
      <input id="group" name="group" type="text" required maxlength="50" placeholder="ИС-21">
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="200" placeholder="you@example.com">
    </div>

    <div class="field">
      <label for="teacher">Преподаватель</label>
      <input id="teacher" name="teacher" type="text" maxlength="100" placeholder="Петров П.П.">
    </div>

    <button type="submit" class="btn"><span>Начать тест</span></button>
  </form>

</div>

<script>
  const form = document.getElementById('form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const user = {
      login:   (fd.get('login')   || '').toString().trim(),
      group:   (fd.get('group')   || '').toString().trim(),
      email:   (fd.get('email')   || '').toString().trim(),
      teacher: (fd.get('teacher') || '').toString().trim()
    };
    if (!user.login || !user.group || !user.email) {
      alert('Заполните обязательные поля');
      return;
    }
    localStorage.setItem('quiz_user', JSON.stringify(user));
    window.location.href = 'test.html';
  });
</script>
</body>
</html>
