<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информационная безопасность — Начало теста</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }

        .container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 560px;
            padding: 48px 44px;
            position: relative;
            overflow: hidden;
        }

            .container::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 4px;
                background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
            }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 24px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 36px;
            font-size: 14px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

            label .req {
                color: #f87171;
            }

        input {
            width: 100%;
            padding: 14px 16px;
            background: #0f172a;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text);
            transition: all 0.2s;
            outline: none;
            font-family: inherit;
        }

            input::placeholder {
                color: #475569;
            }

            input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 32px rgba(99, 102, 241, 0.5);
            }

            button:active {
                transform: translateY(0);
            }

        .error {
            color: #f87171;
            font-size: 13px;
            margin-top: 8px;
            padding: 10px 14px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-dim);
        }

            .features span {
                display: flex;
                align-items: center;
                gap: 6px;
            }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🔐</div>
        <h1>Тест по информационной безопасности</h1>
        <p class="subtitle">Заполните данные и ответьте на 8 вопросов<br>по основам кибербезопасности</p>

        <div class="field">
            <label>Логин / ФИО <span class="req">*</span></label>
            <input type="text" id="login" placeholder="Введите логин или ФИО" maxlength="50">
        </div>

        <div class="field">
            <label>Группа <span class="req">*</span></label>
            <input type="text" id="group" placeholder="Например: ИС-21" maxlength="20">
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="your@email.com" maxlength="60">
        </div>

        <div class="field">
            <label>Преподаватель</label>
            <input type="text" id="teacher" placeholder="ФИО преподавателя" maxlength="50">
        </div>

        <div class="error" id="error">⚠️ Заполните обязательные поля: Логин и Группа</div>

        <button onclick="startTest()">
            Начать тест
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
        </button>

        <div class="features">
            <span>📝 8 вопросов</span>
            <span>⏱️ ~5 минут</span>
            <span>🎯 1 попытка</span>
        </div>
    </div>

    <script>
        function startTest() {
            const login = document.getElementById('login').value.trim();
            const group = document.getElementById('group').value.trim();
            const email = document.getElementById('email').value.trim();
            const teacher = document.getElementById('teacher').value.trim();
            const err = document.getElementById('error');

            if (!login || !group) {
                err.style.display = 'flex';
                return;
            }

            localStorage.setItem('quiz_user', JSON.stringify({
                login, group, email, teacher
            }));

            window.location.href = 'test.html';
        }

        // Enter для отправки
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keydown', e => {
                if (e.key === 'Enter') startTest();
            });
        });
    </script>
</body>
</html>
