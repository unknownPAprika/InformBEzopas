<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест пройден</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --bg-soft: #151518;
    --border: rgba(255,255,255,0.07);
    --text: #ededee;
    --text-dim: #8d8d94;
    --accent: #c9a86a;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 60px 44px 44px;
    text-align: center;
    position: relative;
    animation: riseIn 0.7s cubic-bezier(0.2,0.8,0.2,1);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    transform: translateX(-50%);
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .check {
    width: 68px;
    height: 68px;
    margin: 0 auto 32px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: pop 0.6s cubic-bezier(0.68,-0.55,0.265,1.55);
  }
  .check::before,
  .check::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    opacity: 0;
    animation: ripple 2.4s ease-out infinite;
  }
  .check::after { animation-delay: 1.2s; }

  @keyframes pop {
    0%   { transform: scale(0); opacity: 0; }
    60%  { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes ripple {
    0%   { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .check svg {
    width: 30px;
    height: 30px;
    stroke: var(--accent);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }
  .check svg path {
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: draw 0.6s 0.4s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .eyebrow {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    padding-left: 34px;
    position: relative;
    margin-bottom: 18px;
  }
  .eyebrow::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    width: 24px; height: 1px;
    background: var(--accent);
    transform: translateY(-50%);
  }

  h1 {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.015em;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 16px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.7;
    margin: 0 auto 40px;
    max-width: 340px;
  }

  .status {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
    display: none;
  }
  .status.show { display: block; animation: fadeIn 0.5s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .btn {
    width: 100%;
    height: 54px;
    padding: 0 32px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 0;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--bg);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .btn:hover { color: var(--accent); }
  .btn:hover::before { transform: scaleX(1); transform-origin: left; }
  .btn > * { position: relative; z-index: 1; }

  @media (max-width: 480px) {
    body { padding: 24px 14px; }
    .card { padding: 46px 26px 32px; }
    h1 { font-size: 24px; }
    .check { width: 60px; height: 60px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="check">
    <svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
  </div>

  <span class="eyebrow">Завершено</span>
  <h1>Тест пройден</h1>
  <p class="subtitle">Ваши ответы сохранены. Продолжите, чтобы увидеть результат.</p>

  <div class="status" id="status">Результат сохранён</div>

  <button class="btn" onclick="viewResults()" id="viewBtn"><span>Посмотреть результат</span></button>
</div>

<script>
  const questions = [
    { correct: 1 }, { correct: 2 }, { correct: 2 }, { correct: 3 }, { correct: 0 },
    { correct: 3 }, { correct: 2 }, { correct: 1 }, { correct: 2 }, { correct: 1 },
    { correct: 0 }, { correct: 1 }, { correct: 0 }, { correct: 2 }, { correct: 2 },
    { correct: 2 }, { correct: 0 }, { correct: 1 }, { correct: 2 }, { correct: 2 },
    { correct: 0 }, { correct: 1 }, { correct: 2 }, { correct: 1 }, { correct: 2 },
    { correct: 2 }, { correct: 2 }, { correct: 1 }, { correct: 0 }, { correct: 1 },
    { correct: 2 }, { correct: 1 }, { correct: 2 }, { correct: 1 }, { correct: 2 },
    { correct: 2 }, { correct: 0 }, { correct: 2 }, { correct: 1 }, { correct: 1 }
  ];

  const user = JSON.parse(localStorage.getItem('quiz_user') || 'null');
  const userAnswers = JSON.parse(localStorage.getItem('quiz_answers') || 'null');

  if (!user || !userAnswers) {
    window.location.href = 'index.html';
  } else {
    saveResults();
  }

  function saveResults() {
    let correctCount = 0;
    questions.forEach((q, i) => { if (userAnswers[i] === q.correct) correctCount++; });
    const total = questions.length;
    const percent = Math.round(correctCount / total * 100);

    localStorage.setItem('quiz_result', JSON.stringify({
      user, userAnswers, correctCount, total, percent,
      date: new Date().toISOString()
    }));

    const status = document.getElementById('status');
    status.textContent = 'Результат сохранён';
    status.classList.add('show');
  }

  function viewResults() {
    window.location.href = 'old.html';
  }
</script>
</body>
</html>
